<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/preferences.css"?>

<!DOCTYPE window SYSTEM "chrome://zotero/locale/zotero.dtd">

<window
    xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
    xmlns:html="http://www.w3.org/1999/xhtml"
    title="ZotMoov"
    drawintitlebar-platforms="mac"
    class="zotero-dialog"
    style="min-width: 500px; min-height:300px">
<dialog buttons="cancel,accept" id="zotmoov-cw-dialog">
    <script src="chrome://zotero/content/include.js"/>

    <linkset><html:link rel="localization" href="zotmoov.ftl"/></linkset>

    <vbox style='margin-bottom: 10px;'>
        <hbox align="center">
            <label data-l10n-id="zotmoov-adv-settings-cmu-command"/>
            <menulist native="true" id="zotmoov-adv-settings-wc-sel-menu">
                <menupopup>
                    <menuitem id="zotmoov-cw-item-move" value="move" data-l10n-id="zotmoov-menu-item-move-title"/>
                    <menuitem id="zotmoov-cw-item-copy" value="copy" data-l10n-id="zotmoov-menu-item-copy-title"/>
                    <menuitem id="zotmoov-cw-item-add_tag" value="add_tag" data-l10n-id="zotmoov-menu-item-addtag-title"/>
                    <menuitem id="zotmoov-cw-item-rem_tag" value="rem_tag" data-l10n-id="zotmoov-menu-item-remtag-title"/>
                    <menuitem id="zotmoov-cw-item-move_from" value="move_from" data-l10n-id="zotmoov-menu-item-movefrom-title"/>
                    <menuitem id="zotmoov-cw-item-ann2note" value="ann2note" data-l10n-id="zotmoov-menu-item-ann2note-title"/>
                </menupopup>
            </menulist>
        </hbox>
        <vbox style="margin-top: 10px;">
            <hbox><label id="zotmoov-cw-label1"></label></hbox>
            <vbox id="zotmoov-cw-dir-input1" style="display: none;">
                <hbox align="center">
                    <checkbox id = "zotmoov-cw-dir-input1-checkbox" native="true" data-l10n-id="zotmoov-adv-settings-directory-checkbox1"/>
                </hbox>
                <hbox align="center">
                    <html:input type="text" id="zotmoov-dst-dir" readonly="true" style="flex: 1; margin-left: 0;" disabled="true"/>
                    <button id="zotmoov-dst-dir-button" data-l10n-id="zotmoov-settings-filepath-button-label" disabled="true"/>
                </hbox>
            </vbox>
            <vbox>
                <hbox align="center">
                    <html:input type="text" id="zotmoov-cw-text-input1" style="flex: 1; margin-left: 0; display: none;"/>
                </hbox>
            </vbox>
        </vbox>
        <vbox style="margin-top: 10px;">
            <hbox align="center">
                <checkbox id="zotmoov-enable-subdir" native="true" style="display: none;"/>
            </hbox>
        </vbox>
    </vbox>

    <script src="chrome://zotmoov/content/custom-cmu-dialog.js"/>
</dialog>
</window>
